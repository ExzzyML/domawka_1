[pytest]
pythonpath = .
testpaths = tests
# Старые тесты намеренно обрывают спуск через маленький max_iter, им
# ConvergenceWarning не нужен. Тесты самих предупреждений ловят его явно
# (pytest.warns и warnings.catch_warnings работают поверх этого фильтра).
filterwarnings =
    ignore::linear_models.base.ConvergenceWarning